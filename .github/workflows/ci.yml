name: CI

on:
  push:
    branches:
      - '**'
      - '!main'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests
        run: npm test

      - name: Lint source
        run: npm run lint

      - name: Check chemistry data
        run: npm run check:chemistry

      - name: Build Next.js
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
        run: npx next build
