<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 260" width="100%" height="240" style="background: transparent;">
  <!-- Yuqori qatlam (hex rings) -->
  <g fill="#3B82F6" stroke="#60A5FA" stroke-width="2">
    <!-- Yuqori qatlam chiziqlari -->
    <path d="M 60 70 L 110 50 L 160 70 L 160 110 L 110 130 L 60 110 Z" fill="none" stroke="#93C5FD" stroke-width="3" />
    <path d="M 160 70 L 210 50 L 260 70 L 260 110 L 210 130 L 160 110 Z" fill="none" stroke="#93C5FD" stroke-width="3" />
    <path d="M 260 70 L 310 50 L 360 70 L 360 110 L 310 130 L 260 110 Z" fill="none" stroke="#93C5FD" stroke-width="3" />

    <!-- Atomlar -->
    <circle cx="60" cy="70" r="12" />
    <circle cx="110" cy="50" r="12" />
    <circle cx="160" cy="70" r="12" />
    <circle cx="210" cy="50" r="12" />
    <circle cx="260" cy="70" r="12" />
    <circle cx="310" cy="50" r="12" />
    <circle cx="360" cy="70" r="12" />
    <circle cx="60" cy="110" r="12" />
    <circle cx="110" cy="130" r="12" />
    <circle cx="160" cy="110" r="12" />
    <circle cx="210" cy="130" r="12" />
    <circle cx="260" cy="110" r="12" />
    <circle cx="310" cy="130" r="12" />
    <circle cx="360" cy="110" r="12" />
  </g>

  <!-- Qatlamlararo kuchsiz bog'lar (punktir) -->
  <g stroke="#F59E0B" stroke-width="2" stroke-dasharray="4,4">
    <line x1="110" y1="130" x2="110" y2="200" />
    <line x1="210" y1="130" x2="210" y2="200" />
    <line x1="310" y1="130" x2="310" y2="200" />
    <line x1="160" y1="110" x2="160" y2="180" />
    <line x1="260" y1="110" x2="260" y2="180" />
  </g>

  <!-- Quyi qatlam -->
  <g fill="#9333EA" stroke="#C084FC" stroke-width="2">
    <path d="M 60 180 L 110 160 L 160 180 L 160 220 L 110 240 L 60 220 Z" fill="none" stroke="#D8B4FE" stroke-width="3" />
    <path d="M 160 180 L 210 160 L 260 180 L 260 220 L 210 240 L 160 220 Z" fill="none" stroke="#D8B4FE" stroke-width="3" />
    <path d="M 260 180 L 310 160 L 360 180 L 360 220 L 310 240 L 260 220 Z" fill="none" stroke="#D8B4FE" stroke-width="3" />

    <circle cx="60" cy="180" r="10" />
    <circle cx="110" cy="160" r="10" />
    <circle cx="160" cy="180" r="10" />
    <circle cx="210" cy="160" r="10" />
    <circle cx="260" cy="180" r="10" />
    <circle cx="310" cy="160" r="10" />
    <circle cx="360" cy="180" r="10" />
    <circle cx="60" cy="220" r="10" />
    <circle cx="110" cy="240" r="10" />
    <circle cx="160" cy="220" r="10" />
    <circle cx="210" cy="240" r="10" />
    <circle cx="260" cy="220" r="10" />
    <circle cx="310" cy="240" r="10" />
    <circle cx="360" cy="220" r="10" />
  </g>
</svg>
